# Configuração do Secretário (V0 + V1 em construção).
# Caminhos relativos são resolvidos a partir da pasta do projeto.

[app]
data_dir = "data"                          # banco, logs; fora do git
workspace_dir = "data/workspace"           # única pasta que as ferramentas de arquivo enxergam
system_prompt_file = "config/system_prompt.md"
default_model = "local"                    # modelo preferido ao abrir uma conversa
sensitive_fallback_model = "local"         # usado quando o sigilo não permite o preferido; precisa ser local
default_label = "publico"                  # nível inicial: publico, interno, confidencial, restrito

[ui]
host = "127.0.0.1"                         # só loopback: a V0 não tem login
port = 8000

[limits]
max_history_messages = 40

# ---------------------------------------------------------------------------
# Ferramentas (V1). Toda chamada passa pelo gateway em tools/gateway.py:
# perfil -> validação dos argumentos -> risco/aprovação -> execução com
# tempo limite -> auditoria. Troque o perfil da conversa com /ferramentas <perfil>.
# ---------------------------------------------------------------------------

[tools]
profile = "basico"                         # perfil das conversas novas
max_steps = 5                              # chamadas ao modelo por turno; a última já não oferece ferramentas
timeout_s = 20                             # tempo máximo de cada ferramenta
max_result_chars = 4000                    # resultado maior é cortado antes de voltar ao modelo

[tools.profiles]
nenhum = []
basico = ["get_datetime", "list_files"]

# ---------------------------------------------------------------------------
# Modelos. Cada seção [models.<chave>] é um perfil; troque com /modelo <chave>.
#
# max_label = nível máximo de sigilo que o modelo pode receber.
# Um modelo é considerado LOCAL só se base_url for 127.0.0.1/localhost e o
# nome não terminar em "cloud" (modelos ":cloud" do Ollama rodam na nuvem).
# Modelos externos não aceitam max_label acima de "interno" sem
# allow_sensitive_external = true.
#
# max_context_chars = orçamento de caracteres do histórico enviado ao modelo.
# Para o Ollama, mantenha coerente com OLLAMA_CONTEXT_LENGTH (tokens):
# em português, conte uns 3 caracteres por token e reserve espaço para a resposta.
# ---------------------------------------------------------------------------

[models.local]
display_name = "Qwen3.5 4B (local)"
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3.5:4b"
max_label = "restrito"
temperature = 0.6
max_output_tokens = 1024
reasoning_effort = "none"                  # sem "pensar" antes de responder: muito mais rápido em CPU
max_context_chars = 18000                  # cabe em OLLAMA_CONTEXT_LENGTH = 8192
timeout_s = 300

[models.gemini]
display_name = "Gemini Flash (nuvem, plano gratuito)"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
model = "gemini-flash-latest"              # se der "modelo não encontrado", use o nome que aparece no AI Studio
api_key_secret = "GEMINI_API_KEY"          # guardado com: uv run secretario-secrets set GEMINI_API_KEY
max_label = "publico"                      # plano gratuito: o Google pode usar os dados; só dados públicos/sintéticos
stream_usage = false
max_context_chars = 200000
timeout_s = 120

